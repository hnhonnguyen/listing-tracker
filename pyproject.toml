[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-tracker"
version = "0.1.0"
description = "Config-driven web scraper and price tracker with SQLite history and change reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
listing-tracker = "listing_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["listing_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
